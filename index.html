<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <a class="logo" href="#">KFC</a>
                <div class="menu">
                    <a href="#">About Us</a>
                    <a href="#">Find Us</a>
                    <a href="#">All Campaigns</a>
                    <a class="icon" href="#"><img src="/Frame (2).png" alt=""></a>
                    <a class="icon" href="#"><img src="/Frame (3).png" alt=""></a>
                </div>
            </nav>
        </div>
    </header>
    <header class="hero-header">
        <div class="container">
            <div class="hero">

                <div class="hero-text">
                    <h1>Jagonya Ayam<br>Bucket Menu<br>Campaign</h1>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Urna id ac velit convallis nec tellus.

                </div>

                <div class="hero-img">
                    <img class="img-big" src="/image 2 (2).png" alt="">
                    <img class="img-chicken" src="/image 4 (1).png" alt="">
                    <img class="img-fries" src="/image 3.png" alt="">

                        <div>

                            <span class="small">999</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    <div class="menu-bar">

        <div class="container">
            <div class="menu-items">
                <div class="menu-item"><img src="/image 11 (1).png" alt="">Chicken Bucket</div>
                <div class="menu-item"><img src="/image 12 (1).png" alt="">Family Box</div>
                <div class="menu-item active"><img src="/image 13 (1).png" alt="">Breakfast Menu</div>
                <div class="menu-item"><img src="/image 14 (1).png" alt="">Hungry Special</div>
                <div class="menu-item"><img src="/image 15 (1).png" alt="">Snack Bucket</div>
